<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="920" viewBox="0 0 1360 920" role="img" aria-labelledby="title desc">
  <title id="title">Luma's Event Ticketing and Check-in ERD</title>
  <desc id="desc">Relational entities for users, roles, events, registrations, tickets, payments, check-ins, and event updates.</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#40566f"/></marker><style>
    .bg{fill:#f6f8fb}.title{font:700 26px Arial;fill:#13243a}.sub{font:14px Arial;fill:#5b6d80}.head{font:700 16px Arial;fill:#17324f}.txt{font:13px Arial;fill:#33465d}.key{font:700 12px Arial;fill:#2e587e}.box{stroke-width:2;rx:10}.rel{fill:none;stroke:#40566f;stroke-width:2;marker-end:url(#arr)}.reltext{font:12px Arial;fill:#40566f}
  </style></defs>
  <rect class="bg" width="1360" height="920"/><text x="44" y="48" class="title">Event Ticketing and Check-in System · ERD</text><text x="44" y="74" class="sub">Luma Chrisparr Ngale Jomia · FE25A114 · Week 5 individual work</text>
  <g>
    <rect class="box" x="50" y="120" width="230" height="166" fill="#eaf3ff" stroke="#6c8ebf"/><text x="68" y="148" class="head">users</text><text x="68" y="174" class="key">PK id</text><text x="68" y="196" class="txt">display_name</text><text x="68" y="216" class="txt">email_or_phone</text><text x="68" y="236" class="txt">password_hash</text><text x="68" y="256" class="txt">created_at</text>
    <rect class="box" x="420" y="120" width="210" height="110" fill="#eaf3ff" stroke="#6c8ebf"/><text x="438" y="148" class="head">roles</text><text x="438" y="174" class="key">PK id</text><text x="438" y="196" class="txt">UNIQUE name</text>
    <rect class="box" x="235" y="340" width="220" height="106" fill="#eaf3ff" stroke="#6c8ebf"/><text x="253" y="368" class="head">user_roles</text><text x="253" y="394" class="key">PK, FK user_id</text><text x="253" y="418" class="key">PK, FK role_id</text>
    <rect class="box" x="50" y="520" width="300" height="200" fill="#effaf6" stroke="#6caa98"/><text x="68" y="548" class="head">events</text><text x="68" y="574" class="key">PK id · FK organizer_id</text><text x="68" y="596" class="txt">title, description, venue</text><text x="68" y="616" class="txt">starts_at, ends_at</text><text x="68" y="636" class="txt">capacity, registration_deadline</text><text x="68" y="656" class="txt">ticket_price_xaf, status</text>
    <rect class="box" x="500" y="520" width="310" height="200" fill="#effaf6" stroke="#6caa98"/><text x="518" y="548" class="head">registrations</text><text x="518" y="574" class="key">PK id · FK event_id</text><text x="518" y="596" class="txt">attendee_name, contact_value</text><text x="518" y="616" class="txt">normalized_contact</text><text x="518" y="636" class="txt">payment_status, registered_at</text><text x="518" y="656" class="txt">UNIQUE(event_id, normalized_contact)</text>
    <rect class="box" x="1010" y="120" width="270" height="142" fill="#effaf6" stroke="#6caa98"/><text x="1028" y="148" class="head">tickets</text><text x="1028" y="174" class="key">PK id · FK registration_id UNIQUE</text><text x="1028" y="196" class="txt">UNIQUE ticket_identifier</text><text x="1028" y="218" class="txt">status, issued_at</text>
    <rect class="box" x="1010" y="340" width="270" height="152" fill="#fff7e8" stroke="#d6a64c"/><text x="1028" y="368" class="head">payments</text><text x="1028" y="394" class="key">PK id · FK registration_id</text><text x="1028" y="416" class="key">FK recorded_by_user_id</text><text x="1028" y="438" class="txt">amount_xaf, payment_method</text><text x="1028" y="460" class="txt">recorded_at</text>
    <rect class="box" x="1010" y="590" width="270" height="140" fill="#fff7e8" stroke="#d6a64c"/><text x="1028" y="618" class="head">check_ins</text><text x="1028" y="644" class="key">PK id · FK registration_id UNIQUE</text><text x="1028" y="666" class="key">FK staff_user_id</text><text x="1028" y="688" class="txt">checked_in_at</text>
    <rect class="box" x="500" y="790" width="310" height="110" fill="#fff7e8" stroke="#d6a64c"/><text x="518" y="818" class="head">event_updates</text><text x="518" y="844" class="key">PK id · FK event_id</text><text x="518" y="866" class="txt">FK published_by_user_id · message · published_at</text>
  </g>
  <path class="rel" d="M165 286 C165 318 250 312 300 340"/><text x="171" y="318" class="reltext">1 to many</text>
  <path class="rel" d="M525 230 C525 300 440 295 410 340"/><text x="478" y="293" class="reltext">1 to many</text>
  <path class="rel" d="M210 286 C210 420 150 435 150 520"/><text x="160" y="460" class="reltext">organizes</text>
  <path class="rel" d="M350 620 L500 620"/><text x="384" y="608" class="reltext">1 to many</text>
  <path class="rel" d="M810 550 C880 460 920 320 1010 220"/><text x="882" y="410" class="reltext">one ticket</text>
  <path class="rel" d="M810 610 C900 610 930 420 1010 420"/><text x="874" y="532" class="reltext">payment records</text>
  <path class="rel" d="M810 660 C910 720 920 680 1010 660"/><text x="874" y="700" class="reltext">0 or 1 check-in</text>
  <path class="rel" d="M200 720 C250 835 400 845 500 845"/><text x="286" y="810" class="reltext">event has updates</text>
  <rect x="50" y="780" width="390" height="100" rx="10" fill="#e9eef5"/><text x="70" y="815" class="txt">Unique ticket per registration.</text><text x="70" y="839" class="txt">At most one check-in per registration.</text><text x="70" y="863" class="txt">Money uses whole XAF values.</text>
</svg>
