<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="900" viewBox="0 0 1520 900" role="img" aria-labelledby="title desc">
  <title id="title">Sequence diagram for event registration</title>
  <desc id="desc">An attendee registers through the browser and application layers. An alternative frame shows rejection and successful registration with a ticket.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#40566f"/></marker><style>
    .bg{fill:#fff}.title{font:700 23px Arial;fill:#13243a}.sub{font:14px Arial;fill:#5b6d80}.head{font:700 14px Arial;fill:#17324f}.participant{fill:#eaf3ff;stroke:#6c8ebf;stroke-width:2;rx:8}.green{fill:#effaf6;stroke:#6caa98}.gold{fill:#fff7e8;stroke:#d6a64c}.life{stroke:#8a98a8;stroke-dasharray:7 6;stroke-width:1.5}.msg{stroke:#40566f;stroke-width:1.8;marker-end:url(#arrow)}.reply{stroke:#788898;stroke-width:1.5;stroke-dasharray:7 5;marker-end:url(#arrow)}.label{font:12px Arial;fill:#33465d}.frame{fill:none;stroke:#8797a8;stroke-width:2}.frametxt{font:700 13px Arial;fill:#33465d}.fail{fill:#fff0ef;stroke:#d98278}.ok{fill:#effaf6;stroke:#6caa98}.note{fill:#e9eef5;stroke:#aab7c4}
  </style></defs>
  <rect class="bg" width="1520" height="900"/><text x="34" y="42" class="title">UC-02 · Register for an event and receive a ticket</text><text x="34" y="66" class="sub">Luma Chrisparr Ngale Jomia · FE25A114 · Week 6 individual sequence diagram</text>
  <g class="head">
    <rect class="participant" x="30" y="95" width="150" height="48"/><text x="105" y="125" text-anchor="middle">Attendee</text>
    <rect class="participant" x="245" y="95" width="150" height="48"/><text x="320" y="125" text-anchor="middle">Browser</text>
    <rect class="participant green" x="465" y="95" width="190" height="48"/><text x="560" y="125" text-anchor="middle">RegistrationController</text>
    <rect class="participant green" x="725" y="95" width="180" height="48"/><text x="815" y="125" text-anchor="middle">RegistrationService</text>
    <rect class="participant gold" x="975" y="95" width="250" height="48"/><text x="1100" y="125" text-anchor="middle">Event / Registration / Ticket Repositories</text>
    <rect class="participant gold" x="1320" y="95" width="160" height="48"/><text x="1400" y="125" text-anchor="middle">Database</text>
  </g>
  <path class="life" d="M105 143V780 M320 143V780 M560 143V780 M815 143V780 M1100 143V780 M1400 143V780"/>
  <line class="msg" x1="105" y1="180" x2="320" y2="180"/><text class="label" x="205" y="171" text-anchor="middle">1. Enter name and contact</text>
  <line class="msg" x1="320" y1="225" x2="560" y2="225"/><text class="label" x="440" y="216" text-anchor="middle">2. POST registration</text>
  <line class="msg" x1="560" y1="270" x2="815" y2="270"/><text class="label" x="688" y="261" text-anchor="middle">3. Validate fields; call register(...)</text>
  <line class="msg" x1="815" y1="315" x2="1400" y2="315"/><text class="label" x="1105" y="306" text-anchor="middle">4. BEGIN TRANSACTION</text>
  <line class="msg" x1="815" y1="360" x2="1100" y2="360"/><text class="label" x="958" y="351" text-anchor="middle">5. Load event and registration count</text>
  <line class="msg" x1="1100" y1="400" x2="1400" y2="400"/><text class="label" x="1250" y="391" text-anchor="middle">6. Read event and count</text>
  <line class="reply" x1="1400" y1="425" x2="1100" y2="425"/><text class="label" x="1250" y="444" text-anchor="middle">Event and current count</text>
  <line class="msg" x1="815" y1="465" x2="1100" y2="465"/><text class="label" x="958" y="456" text-anchor="middle">7. Check normalized contact for duplicate</text>
  <line class="msg" x1="1100" y1="505" x2="1400" y2="505"/><text class="label" x="1250" y="496" text-anchor="middle">SELECT existing registration</text>
  <line class="reply" x1="1400" y1="530" x2="1100" y2="530"/><text class="label" x="1250" y="549" text-anchor="middle">Duplicate or none</text>
  <rect class="frame" x="30" y="570" width="1450" height="230"/><rect x="30" y="570" width="230" height="26" fill="#fff" stroke="#8797a8"/><text x="42" y="588" class="frametxt">alt · registration outcome</text>
  <rect class="fail" x="55" y="615" width="660" height="72" rx="8"/><text class="label" x="72" y="640">[Closed, late, full, or duplicate]</text><text class="label" x="72" y="662">Rollback; return 409 and show the reason to the attendee.</text>
  <line class="msg" x1="815" y1="710" x2="1400" y2="710"/><text class="label" x="1107" y="701" text-anchor="middle">ROLLBACK</text>
  <line class="reply" x1="815" y1="745" x2="560" y2="745"/><text class="label" x="690" y="738" text-anchor="middle">409 Conflict</text>
  <rect class="ok" x="750" y="615" width="700" height="72" rx="8"/><text class="label" x="768" y="640">[Event accepts registration]</text><text class="label" x="768" y="662">Insert registration + unique ticket; commit; return 201 and display ticket.</text>
  <line class="msg" x1="815" y1="710" x2="1100" y2="710"/><text class="label" x="958" y="701" text-anchor="middle">Save registration and ticket</text>
  <line class="msg" x1="1100" y1="745" x2="1400" y2="745"/><text class="label" x="1250" y="736" text-anchor="middle">INSERT records, COMMIT</text>
  <rect class="note" x="30" y="825" width="1450" height="54" rx="8"/><text class="label" x="50" y="848">The transaction keeps the registration and ticket together. UNIQUE(event_id, normalized_contact) blocks simultaneous duplicate registrations.</text><text class="label" x="50" y="868">If any check or insert fails, the service rolls back so no partial registration remains.</text>
</svg>
